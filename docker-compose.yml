# The lab: a recording S3 stand-in, and the n8n image running the cases in
# docker/matrix.cjs with n8n's own object store class and bundled AWS SDK.
#   docker compose up -d
#   curl -s localhost:8080/_lab/report        the recorded requests, once "done" is true
# n8n is not started as a service. S3 external storage needs an Enterprise
# licence, so the lab calls the class behind it directly.

services:
  # Stands in for the S3-compatible store. Nothing is forwarded anywhere.
  standin:
    image: node:22-alpine
    command: ["node", "/app/standin.mjs"]
    read_only: true
    environment:
      LAB_SECRET_KEY: ${LAB_SECRET_KEY:-lab-secret-key}
    volumes:
      - ./docker/standin.mjs:/app/standin.mjs:ro
    ports:
      - "${STANDIN_PORT:-8080}:8080"

  lab:
    image: ${N8N_IMAGE:-n8nio/n8n:2.45.6}
    depends_on: [standin]
    entrypoint: ["node", "/lab/matrix.cjs"]
    environment:
      LAB_STANDIN_URL: http://standin:8080
      # The settings n8n reads for S3 external storage.
      N8N_EXTERNAL_STORAGE_S3_HOST: standin:8080
      N8N_EXTERNAL_STORAGE_S3_PROTOCOL: http
      N8N_EXTERNAL_STORAGE_S3_BUCKET_NAME: lab-plain
      N8N_EXTERNAL_STORAGE_S3_BUCKET_REGION: us-east-1
      N8N_EXTERNAL_STORAGE_S3_ACCESS_KEY: lab-access-key
      N8N_EXTERNAL_STORAGE_S3_ACCESS_SECRET: ${LAB_SECRET_KEY:-lab-secret-key}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - ./docker/matrix.cjs:/lab/matrix.cjs:ro
      - ./docker/probe.cjs:/lab/probe.cjs:ro
      - ./docker/md5-preload.cjs:/lab/md5-preload.cjs:ro
